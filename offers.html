<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة الأكل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <!-- 👇 هنا تخلي كود الهيدر بالضبط 👇 -->
    <header class="mini-header">
        <a href="index.html" class="header-logo">
            <img src="photo 1.jop.png" alt="logo">
        </a>
        <a href="cart.html" class="header-cart-btn">
            🛒 السلة (<span class="cart-count-badge">0</span>)
        </a>
    </header>

    

    <!-- حاوية الكروت -->
    <div class="cards">
        <div class="card">
            <img src="photo37.jpg" alt="دولمة">
            <h2>عرض</h2>
            <p style="margin: 5px 0; font-weight: bold; color: #333;">السعر: 25,000 د.ع</p>
            <button onclick="addToCart('عرض', 25000)">إضافة للسلة 🛒</button>
        </div>
        
        <div class="card">
            <img src="photo38.jpg" alt="دولمة">
            <h2>عرض</h2>
            <p style="margin: 5px 0; font-weight: bold; color: #333;">السعر: 10,000 د.ع</p>
            <button onclick="addToCart('عرض', 10000)">إضافة للسلة 🛒</button>
        </div>

        <div class="card">
            <img src="photo28.jpg" alt="دولمة">
            <h2>عرض</h2>
            <p style="margin: 5px 0; font-weight: bold; color: #333;">السعر: 5,000 د.ع</p>
            <button onclick="addToCart('عرض', 5000)">إضافة للسلة 🛒</button>
        </div>
    </div>

    <!-- زر الصعود للأعلى -->
    <a href="#top" class="top-btn" title="العودة الى الاعلى">^</a>

    <!-- سكربت السلة -->
    <script>
        const CART_KEY = "women_cooking_cart";

        function getCart() {
            return JSON.parse(localStorage.getItem(CART_KEY)) || [];
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            updateCartBadge();
        }

        function addToCart(name, price) {
            let cart = getCart();
            let existing = cart.find(item => item.name === name);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ name: name, price: Number(price), quantity: 1 });
            }
 saveCart(cart);
            alert(`تمت إضافة "${name}" إلى السلة 🛒`);
       
        }

        function updateCartBadge() {
            let cart = getCart();
            let total = cart.reduce((sum, item) => sum + item.quantity, 0);
            let badges = document.querySelectorAll(".cart-count-badge");
            badges.forEach(badge => badge.innerText = total);
        }

        document.addEventListener("DOMContentLoaded", updateCartBadge);
    </script>
    <script src="cart.js"></script>
    
</body>
</html>
